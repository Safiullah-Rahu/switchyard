[project]
name = "switchyard"
version = "0.1.0"
description = "Reference OpenAI Agents SDK system for energy-business operations: durable workflows, exactly-once side effects, verified destinations, and approvals enforced in code."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "openai-agents>=0.24",
    "mcp>=2.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "httpx>=0.27",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
switchyard = "switchyard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switchyard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: needs real credentials (skipped by default)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
