# Solar + battery estimator assumptions.
#
# ILLUSTRATIVE DEFAULTS. In a client deployment these come from the client's
# own pricing book and are versioned with the code; every proposal records the
# `assumptions_version` it was priced with.

assumptions_version = "demo-2026.11"
panel_watts = 430
panel_area_m2 = 1.95
usable_roof_fraction = 0.65
degradation_per_year = 0.005
